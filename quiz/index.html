<header class="hero"><div class="container hero-content"><h1>Quiz Engine</h1><p>Choose grade, chapter, difficulty and timer.</p></div></header>
<main class="container py-4">
<section id="setupScreen" class="glass-card p-4 mb-3">
<div class="row g-3"><div class="col-md-4"><label>Name</label><input class="form-control" id="studentName" value="Student"></div>
<div class="col-md-2"><label>Grade</label><select class="form-select" id="gradeSelect"><option value="11">11</option><option value="12">12</option></select></div>
<div class="col-md-2"><label>Chapter</label><select class="form-select" id="chapterSelect"></select></div>
<div class="col-md-2"><label>Difficulty</label><select class="form-select" id="difficultySelect"><option value="all">All</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
<div class="col-md-2"><label>Timer</label><select class="form-select" id="timerSelect"><option value="0">No timer</option><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option></select></div>
</div><button id="startQuizBtn" class="btn btn-accent mt-3">Start Quiz</button></section>
<section id="quizScreen" class="glass-card p-4 mb-3 d-none"><div class="d-flex justify-content-between"><div class="w-75"><div class="progress"><div id="progressBar" class="progress-bar" style="width:0"></div></div></div><strong id="timer"></strong></div><h4 class="mt-3" id="questionText"></h4><div id="optionsWrap"></div><p id="answerFeedback" class="mt-2"></p><button id="nextBtn" class="btn btn-accent">Next</button></section>
<section id="resultScreen" class="glass-card p-4 d-none"><h3>Results</h3><p>Score: <strong id="resultScore"></strong> (<span id="resultPct"></span>)</p><ul id="reviewList"></ul><button id="retryBtn" class="btn btn-accent">Retry</button></section>
</main>
