<header class="hero"><div class="container hero-content"><h1>Leaderboard</h1><p>Track top learners by overall, grade, and chapter.</p></div></header>
<main class="container py-4">
<ul class="nav nav-tabs" id="lbTabs"><li class="nav-item"><button class="nav-link active" data-filter="all">Overall</button></li><li class="nav-item"><button class="nav-link" data-filter="11">Grade 11</button></li><li class="nav-item"><button class="nav-link" data-filter="12">Grade 12</button></li></ul>
<div class="glass-card p-3" id="leaderWrap"></div>
</main>
<script>
const data=JSON.parse(localStorage.getItem('neb_leaderboard')||'[]');
function draw(filter='all'){const arr=data.filter(r=>filter==='all'||String(r.grade)===String(filter)).sort((a,b)=>b.score-a.score).slice(0,20);const wrap=document.getElementById('leaderWrap');wrap.innerHTML=arr.map((r,i)=>`<div class="leader-row d-flex justify-content-between"><span>${i<3?'<span class="medal">'+['🥇','🥈','🥉'][i]+'</span>':''} ${i+1}. ${r.name}</span><span>${r.score} • Grade ${r.grade} • ${r.date||''}</span></div>`).join('')||'<p>No records yet.</p>';}
 draw(); document.querySelectorAll('#lbTabs .nav-link').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lbTabs .nav-link').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)});
 fetch('api/leaderboard.php').then(r=>r.json()).then(api=>{if(Array.isArray(api)&&api.length){localStorage.setItem('neb_leaderboard',JSON.stringify(api));location.reload();}}).catch(()=>{});
</script>
